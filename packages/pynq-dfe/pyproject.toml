[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynq-dfe"
version = "0.1.0"
description = "PYNQ bindings for the RFSoC hard DFE drivers"
requires-python = ">=3.10"
dependencies = ["cffi>=1.15", "numpy"]

[tool.setuptools]
packages = ["pynq_dfe", "pynq_dfe.abi"]

[tool.setuptools.package-data]
pynq_dfe = ["abi/*.h", "abi/*.json"]
